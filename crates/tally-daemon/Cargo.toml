[package]
name = "tally-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"

[lib]
name = "tally_daemon"

[[bin]]
name = "tally"
path = "src/main.rs"

[features]
test-kit = []

[[test]]
name = "golden"
required-features = ["test-kit"]

[dependencies]
tally-scoring = { path = "../tally-scoring", features = ["text"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
anyhow = "1"
ctrlc = "3"
ureq = { version = "2", default-features = false, features = ["tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tiny_http = "0.12"
include_dir = "0.7"
getrandom = "0.2"
flate2 = "1"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"
