[package]
name = "tally-daemon"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "tally_daemon"

[[bin]]
name = "tally"
path = "src/main.rs"

[dependencies]
tally-scoring = { path = "../tally-scoring" }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
