[package]
name = "tally-evidence"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false
description = "Evidence tooling for the pitch (replay comparator, red-team harness, resource and cost measurements). Never shipped to users."

[lib]
name = "tally_evidence"

[[bin]]
name = "tally-evidence"
path = "src/main.rs"

[dependencies]
tally-scoring = { path = "../tally-scoring" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
