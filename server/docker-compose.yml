services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tally"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    image: tally-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/tally
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # These must all be set in .env — the server refuses to start without them.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      HCA_CLIENT_ID: ${HCA_CLIENT_ID:?set in .env}
      HCA_CLIENT_SECRET: ${HCA_CLIENT_SECRET:?set in .env}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:?set in .env}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:?set in .env}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:?set in .env}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set in .env}
      BUNDLE_KEY: ${BUNDLE_KEY:?set in .env}
      BUNDLE_BUCKET: ${BUNDLE_BUCKET:?set in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
