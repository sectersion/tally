name: daemon
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # xvfb gives the X11 idle test a display; elsewhere run directly.
      - if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p tally-daemon --features test-kit
      - if: runner.os != 'Linux'
        run: cargo test -p tally-daemon --features test-kit
      - run: git diff --exit-code crates/tally-daemon/tests/fixtures
      - run: cargo test -p tally-evidence
      - run: cargo clippy -p tally-daemon -p tally-evidence --all-targets -- -D warnings
  evidence-smoke:
    # Proves the resource harness works on every OS. The numbers are NOT published (accelerated, CI hardware).
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tally-daemon -p tally-evidence
      - name: Resource harness smoke run
        shell: bash
        run: |
          ./target/release/tally-evidence resources --tally ./target/release/tally --machine "ci" --duration-min 1 --load accelerated:600 --no-presence --out "$RUNNER_TEMP/r.md"
          grep -q "RSS p95" "$RUNNER_TEMP/r.md"
  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      PORT: "8080"
      # Placeholders so loadConfig passes; the e2e never signs in or calls GitHub.
      PUBLIC_BASE_URL: http://localhost:8080
      BUNDLE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BUNDLE_BUCKET: ci-bucket
      S3_ACCESS_KEY_ID: ci-placeholder
      S3_SECRET_ACCESS_KEY: ci-placeholder
      HCA_CLIENT_ID: ci-placeholder
      HCA_CLIENT_SECRET: ci-placeholder
      GITHUB_APP_SLUG: ci-placeholder
      GITHUB_APP_CLIENT_ID: ci-placeholder
      GITHUB_APP_CLIENT_SECRET: ci-placeholder
      GITHUB_WEBHOOK_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: cargo install wasm-pack --locked
      - run: cd server && bun install && bun run wasm && bun run migrate
      - name: Start server
        run: cd server && (bun run start > ../server.log 2>&1 &)
      - name: Wait for server
        run: |
          for i in $(seq 60); do
            curl -s -o /dev/null http://localhost:8080/v1/ledger/x/head && exit 0
            sleep 1
          done
          cat server.log; exit 1
      - name: Create token and run test
        run: |
          out=$(cd server && bun run token:create e2e/run-$GITHUB_RUN_ID)
          export TALLY_E2E_SERVER=http://localhost:8080
          export TALLY_E2E_PUBLIC_NAME=e2e/run-$GITHUB_RUN_ID
          export TALLY_E2E_PROJECT_ID=$(echo "$out" | sed -n 's/^project_id: //p')
          export TALLY_E2E_TOKEN=$(echo "$out" | sed -n 's/^token: //p')
          echo "::add-mask::$TALLY_E2E_TOKEN"
          cargo test -p tally-daemon --test e2e_server
