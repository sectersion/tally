name: server
on:
  push:
    paths: ["server/**", "crates/tally-scoring/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "crates/tally-scoring/**", ".github/workflows/server.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test # loadConfig fills dummy HCA_* / GITHUB_* values
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: bun run wasm
      - run: bun run typecheck
      - name: fixture is fresh
        run: bun run fixture && git diff --exit-code test/fixtures/chain.json
      - run: bun test
